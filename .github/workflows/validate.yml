name: Community CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: community-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: Validate community
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out community files
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: "python -m pip install --disable-pip-version-check --only-binary=:all: -r requirements.txt"
      - name: Run offline tests
        run: python -m unittest discover -s tests -v
      - name: Check registry, snapshot, catalog, and gallery
        run: python scripts/catalog.py check
      - name: Verify public repositories, READMEs, and licenses
        run: python scripts/catalog.py validate
        env:
          GITHUB_TOKEN: ${{ github.token }}
